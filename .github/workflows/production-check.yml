# Merge-readiness gate for a2c.dev on Cloudflare Pages: builds dist/ with tools/build-prod.sh and runs
# tools/check-production.py with BUILD_TARGET=production PROD_HOST=cloudflare-pages (robots must allow indexing;
# /api/lead only with functions/api/lead.js; removed claims never). Merge to main only as part of the DNS cutover.
name: production-check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Production build + gate
        env: { BUILD_TARGET: production, PROD_HOST: cloudflare-pages }
        run: |
          bash tools/build-prod.sh
          git diff --exit-code -- index.html en/index.html de/index.html || { echo "Built pages differ from committed pages: run the build and commit"; exit 1; }
